<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f5a623"/>
    </marker>
    <marker id="arrowDim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5c5950"/>
    </marker>
    <style>
      .lbl { fill:#9a958c; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; }
      .ttl { fill:#ece7dd; font-size:14px; font-weight:600; }
      .sub { fill:#9a958c; font-size:10px; }
      .tag { fill:#f5a623; font-size:9px; letter-spacing:1px; }
      .box { fill:#101216; stroke:#262b36; stroke-width:1; }
      .boxhi { fill:#16120a; stroke:#f5a623; stroke-width:1.5; }
      .side { fill:#0e1014; stroke:#1d212a; stroke-width:1; }
      .flow { stroke:#f5a623; stroke-width:1.4; fill:none; }
      .flowDim { stroke:#5c5950; stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    </style>
  </defs>

  <rect width="1040" height="600" fill="#0a0b0d"/>
  <text x="32" y="40" class="ttl" font-size="18">AEGIS — verifiable crisis-response architecture</text>
  <text x="32" y="60" class="sub">on-chain decision · bounded non-custodial execution · Arbitrum</text>

  <!-- 1. Signal sources -->
  <text x="32" y="100" class="lbl">1 · Threat signals (off-chain)</text>
  <rect x="32" y="112" width="190" height="150" class="box"/>
  <text x="48" y="138" class="ttl" font-size="12">Sources</text>
  <text x="48" y="162" class="sub">▪ Forta threat feed</text>
  <text x="48" y="182" class="sub">▪ Hypernative / Cyvers</text>
  <text x="48" y="202" class="sub">▪ Chainlink deviation</text>
  <text x="48" y="222" class="sub">▪ on-chain utilization</text>
  <text x="48" y="242" class="sub">▪ governance · social</text>

  <!-- 2. Agent -->
  <text x="262" y="100" class="lbl">2 · Agent (TypeScript)</text>
  <rect x="262" y="112" width="190" height="150" class="box"/>
  <text x="278" y="138" class="ttl" font-size="12">Aggregator</text>
  <text x="278" y="162" class="sub">normalize + dedupe</text>
  <text x="278" y="182" class="sub">drop stale signals</text>
  <text x="278" y="202" class="sub">encode parallel arrays</text>
  <text x="278" y="232" class="tag">viem · keeper session key</text>

  <!-- 3. Stylus engine (highlight) -->
  <text x="492" y="100" class="lbl">3 · Decision (on-chain · Stylus)</text>
  <rect x="492" y="112" width="210" height="150" class="boxhi"/>
  <text x="508" y="138" class="ttl" font-size="12">RiskEngine — Rust</text>
  <text x="508" y="162" class="sub">weighted scoring (bps)</text>
  <text x="508" y="182" class="sub">distinct-source corroboration</text>
  <text x="508" y="202" class="sub">time-decay · threat multiplier</text>
  <text x="508" y="222" class="sub">→ (score, tier, exitFlag)</text>
  <text x="508" y="246" class="tag">VERIFIABLE · &gt;90% less gas vs EVM</text>

  <!-- 4. Vault -->
  <text x="742" y="100" class="lbl">4 · Bounded executor (Solidity)</text>
  <rect x="742" y="112" width="266" height="150" class="box"/>
  <text x="758" y="138" class="ttl" font-size="12">AegisVault</text>
  <text x="758" y="162" class="sub">reads engine verdict (staticcall)</text>
  <text x="758" y="182" class="sub">fires only on auto-fire / confirm</text>
  <text x="758" y="202" class="sub">amount = min(allowance, bal, cap)</text>
  <text x="758" y="222" class="sub">allow-listed adapter · chosen asset</text>
  <text x="758" y="246" class="tag">bind the agent, not the keys (ERC-7715)</text>

  <!-- flow arrows row -->
  <line x1="222" y1="187" x2="260" y2="187" class="flow" marker-end="url(#arrow)"/>
  <line x1="452" y1="187" x2="490" y2="187" class="flow" marker-end="url(#arrow)"/>
  <line x1="702" y1="187" x2="740" y2="187" class="flow" marker-end="url(#arrow)"/>

  <!-- 5. Adapters + protocols -->
  <text x="32" y="320" class="lbl">5 · Protocol unwind (allow-listed adapters)</text>
  <rect x="492" y="332" width="160" height="110" class="box"/>
  <text x="508" y="358" class="ttl" font-size="12">AaveExitAdapter</text>
  <text x="508" y="380" class="sub">Pool.withdraw → user</text>
  <text x="508" y="400" class="sub">Aave V3 · Arb Sepolia</text>
  <text x="508" y="424" class="tag">0x794a…14aD</text>

  <rect x="668" y="332" width="160" height="110" class="box"/>
  <text x="684" y="358" class="ttl" font-size="12">SwapExitAdapter</text>
  <text x="684" y="380" class="sub">DEX swap → USDC</text>
  <text x="684" y="400" class="sub">Stock Tokens · RHC</text>
  <text x="684" y="424" class="tag">Uniswap-v3 style</text>

  <rect x="844" y="332" width="164" height="110" class="side"/>
  <text x="860" y="358" class="ttl" font-size="12">Position → safe</text>
  <text x="860" y="380" class="sub">consolidated to USDC</text>
  <text x="860" y="400" class="sub">delivered to the user</text>
  <text x="860" y="424" class="sub">(never to the agent)</text>

  <line x1="847" y1="262" x2="640" y2="330" class="flow" marker-end="url(#arrow)"/>
  <line x1="875" y1="262" x2="760" y2="330" class="flow" marker-end="url(#arrow)"/>
  <line x1="652" y1="387" x2="666" y2="387" class="flow" marker-end="url(#arrow)"/>
  <line x1="828" y1="387" x2="842" y2="387" class="flow" marker-end="url(#arrow)"/>

  <!-- side integrations -->
  <text x="32" y="320" class="lbl"></text>
  <rect x="32" y="332" width="200" height="110" class="side"/>
  <text x="48" y="358" class="ttl" font-size="12">Identity &amp; reputation</text>
  <text x="48" y="380" class="sub">ERC-8004 register agent</text>
  <text x="48" y="400" class="sub">write exit-outcome score</text>
  <text x="48" y="424" class="tag">0x8004…BD9e</text>

  <rect x="252" y="332" width="220" height="110" class="side"/>
  <text x="268" y="358" class="ttl" font-size="12">Human + paid surface</text>
  <text x="268" y="380" class="sub">Telegram alerts / confirm (grammY)</text>
  <text x="268" y="400" class="sub">x402 paid "priority exit" (USDC)</text>
  <text x="268" y="424" class="tag">CDP facilitator · Arbitrum</text>

  <line x1="597" y1="262" x2="200" y2="330" class="flowDim" marker-end="url(#arrowDim)"/>
  <line x1="352" y1="262" x2="362" y2="330" class="flowDim" marker-end="url(#arrowDim)"/>

  <!-- bottom note -->
  <rect x="32" y="486" width="976" height="80" fill="#0e1014" stroke="#1d212a"/>
  <text x="48" y="512" class="ttl" font-size="12">The seam</text>
  <text x="48" y="534" class="sub">The judgement ("should we exit?") lives in transparent, reproducible Rust on Stylus. The executor is a dumb,</text>
  <text x="48" y="552" class="sub">tightly-bounded Solidity contract. A compromised keeper still cannot exceed a user's cap, asset, or allow-listed adapter.</text>
</svg>
